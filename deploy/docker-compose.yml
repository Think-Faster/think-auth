# Секреты — только в Vault (secret/tf/...). Контейнеры забирают их при каждом старте через
# vault-entrypoint.sh. Из окружения выкатки нужны только VAULT_ROLE_ID и VAULT_SECRET_ID.
#
# $$ — чтобы docker compose не подставлял сам: в контейнер попадёт литерал ${...},
# его заменит vault-entrypoint.sh значением из Vault.

x-vault-access: &vault-access
  VAULT_ADDR: http://vault:8200
  VAULT_ROLE_ID: ${VAULT_ROLE_ID:?VAULT_ROLE_ID is not set}
  VAULT_SECRET_ID: ${VAULT_SECRET_ID:?VAULT_SECRET_ID is not set}

services:

  # Миграции EF Core — под auth_admin (владелец схемы auth), один раз перед запуском приложения.
  tf-auth-migrations:
    container_name: tf-auth-migrations

    build:
      context: ..
      dockerfile: migration/Dockerfile.migrations

    networks:
      - think-fast-net
      - postgree_app-network

    environment:
      <<: *vault-access
      VAULT_SECRET_PATHS: postgres/auth
      VAULT_EXPAND: ConnectionStrings__DefaultConnection
      ConnectionStrings__DefaultConnection: "Host=tf-postgres;Port=5432;Database=tf;Username=auth_admin;Password=$${TF_PG_AUTH_ADMIN_PASSWORD}"

    restart: "no"

  tf-auth:
    container_name: tf-auth

    build:
      context: ..
      dockerfile: AuthService/Dockerfile

    depends_on:
      tf-auth-migrations:
        condition: service_completed_successfully

    networks:
      - think-fast-net
      - postgree_app-network

    # Секреты-файлы — в памяти, не на диске контейнера.
    tmpfs:
      - /run/secrets

    environment:
      <<: *vault-access

      # Каждый ключ этих путей станет переменной окружения.
      VAULT_SECRET_PATHS: postgres/auth redis app/tf-auth

      # Переменные, в которые подставить секреты при старте.
      VAULT_EXPAND: ConnectionStrings__DefaultConnection Redis__ConnectionString

      # Ключ подписи JWT: хранится в Vault в base64, при старте пишется в файл (права 600).
      VAULT_FILES: TF_AUTH_JWT_PRIVATE_KEY_B64:/run/secrets/jwt-private.pem
      Jwt__PrivateKeyPath: /run/secrets/jwt-private.pem

      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Jwt__Issuer: auth-service
      Jwt__Audience: api

      # Приложение — только под auth_user (без DDL).
      ConnectionStrings__DefaultConnection: "Host=tf-postgres;Port=5432;Database=tf;Username=auth_user;Password=$${TF_PG_AUTH_USER_PASSWORD}"
      Redis__ConnectionString: "tf-redis:6379,password=$${TF_REDIS_PASSWORD}"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Старт может ждать распечатывания Vault.
      start_period: 60s

    restart: unless-stopped

networks:
  think-fast-net:
    external: true
  postgree_app-network:
    external: true
