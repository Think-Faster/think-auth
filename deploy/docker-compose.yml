services:

  auth-service:
    container_name: auth-service

    build:
      context: ../AuthService
      dockerfile: Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: ${ASPNETCORE_HTTP_PORTS:-8080}

    ports:
      - "${AUTH_SERVICE_PORT:-8080}:${ASPNETCORE_HTTP_PORTS:-8080}"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${ASPNETCORE_HTTP_PORTS:-8080}/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped